# Render Blueprint for the QMan API.
#
# Render → New → Blueprint → select this repository. Render reads this file and
# asks for the two values marked `sync: false`. The service name fixes the
# address at https://qman-api.onrender.com, which apps/web/vercel.json forwards
# /api to. If Render reports the name as taken, choose another and update the
# rewrite destination in apps/web/vercel.json to match.
services:
  - type: web
    name: qman-api
    runtime: node
    # Free: sleeps after 15 minutes without a request and takes about a minute
    # to wake. An open display board polls every few seconds and keeps it
    # awake. Change to `starter` to remove the sleep; no code changes needed.
    plan: free
    # Pick the region closest to your clinics, and create the Supabase project
    # in the matching region (Frankfurt ↔ Supabase eu-central-1).
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build -w @qman/api
    startCommand: npm start -w @qman/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Supabase signs its database certificates with its own root CA, which
      # Node does not ship. Trusting that one public CA keeps certificate
      # verification on. Render checks the repository out at this path.
      - key: NODE_EXTRA_CA_CERTS
        value: /opt/render/project/src/certs/supabase-ca-2021.crt
      # Requests pass through two proxies: Vercel's rewrite, then Render's.
      - key: QMAN_TRUST_PROXY
        value: "2"
      # Supabase → Connect → Session pooler connection string.
      - key: DATABASE_URL
        sync: false
      # The Vercel address exactly, e.g. https://qman.vercel.app (no trailing slash).
      - key: QMAN_ALLOWED_ORIGINS
        sync: false
